name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            dependencies: current
          - os: macos-latest
            python: '3.13'
            dependencies: current
          - os: ubuntu-latest
            python: '3.11'
            dependencies: minimum
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build ruff
      - run: python -m ruff check src tests bench
      - run: python -m build
      - name: Lower-bound numerical dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install numpy==1.26.4 scipy==1.12.0
      - run: python -m pip install dist/*.whl
      - run: python -m pip install pytest sympy numpy scipy
      - name: Test installed wheel from outside checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir sdist-wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.dependencies }}
          path: dist/*
