[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-gabor-bounds"
version = "0.1.0"
description = "Denominator-independent Gaussian Gabor finite sections with explicit analytic error indicators"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaiwen Jin", email = "yui.ui.siki@gmail.com"}]
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.3", "ruff>=0.14"]

[project.urls]
Repository = "https://github.com/yuiyuiui/gaussian-gabor-bounds"
Documentation = "https://github.com/yuiyuiui/gaussian-gabor-bounds/tree/main/docs"
Issues = "https://github.com/yuiyuiui/gaussian-gabor-bounds/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
